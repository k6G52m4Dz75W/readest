name: Nightly dist

on:
  schedule:
    - cron: '18 22 * * *' # 06:18 Beijing (22:18 UTC), off-peak minute
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-dist
  cancel-in-progress: false

jobs:
  # Merge upstream/main into dist every night, keeping the fork's own .github
  # (GITHUB_TOKEN cannot push workflow-file changes - hard platform rule).
  # .github updates flow via the user's periodic local sync instead.
  # Collect the upstream commit list since the last build for the release notes.
  sync-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist
          fetch-depth: 0
      - name: Merge upstream/main into dist (keep fork .github) and push
        run: |
          git config user.name "nightly-dist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/readest/readest.git
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "dist already contains upstream/main"
          else
            git merge upstream/main --no-edit || { echo "::error::merge conflict - resolve by hand"; exit 1; }
            git restore --source="$BEFORE" --staged --worktree -- .github || true
            git clean -fd -- .github >/dev/null 2>&1 || true
            git commit -am "dist: keep fork .github over upstream's" 2>/dev/null || true
            git push origin dist
          fi
      - name: Collect upstream commits since last build
        id: notes
        run: |
          BEFORE=$(git log -1 --format=%P HEAD | awk '{print $1}')
          [ -n "$BEFORE" ] || BEFORE=$(git rev-parse HEAD)
          {
            echo 'notes<<EOF'
            git log --oneline --no-merges ${BEFORE}..HEAD | sed 's/^/- /'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  # Nightly version stamp mirrors upstream's nightly.yml: <base>-<YYYYMMDDHH>.
  compute-version:
    needs: sync-dist
    runs-on: ubuntu-latest
    outputs:
      nightly_version: ${{ steps.v.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist
      - id: v
        run: |
          BASE=$(node -p "require('./apps/readest-app/package.json').version")
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d%H)
          echo "nightly_version=${BASE}-${STAMP}" >> "$GITHUB_OUTPUT"

  # -------------------------- WINDOWS (portable exe) -------------------------
  windows-x64:
    needs: [sync-dist, compute-version]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist
          persist-credentials: false
      - name: initialize git submodules
        run: git submodule update --init --recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/readest-app/src-tauri
          key: dist-windows-cargo
      - name: build portable exe
        shell: bash
        timeout-minutes: 60
        env:
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.nightly_version }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          echo "NEXT_PUBLIC_PORTABLE_APP=true" >> .env.local
          node -e "const f='package.json';const j=require('./'+f);j.version='${NIGHTLY_VERSION}';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
          pnpm tauri build --no-bundle
          cd ../..
          cp target/release/readest.exe "Readest_${NIGHTLY_VERSION}_x64-portable.exe"
      - name: sign portable exe for the updater
        shell: bash
        working-directory: apps/readest-app
        env:
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.nightly_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri signer sign "../../Readest_${NIGHTLY_VERSION}_x64-portable.exe"
      - name: Upload to the rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.nightly_version }}
          NOTES: ${{ needs.sync-dist.outputs.notes }}
        run: |
          printf '%s' "$NOTES" > notes.md
          [ -s notes.md ] || echo "No new upstream commits in this build." > notes.md
          gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --title "Readest dist - nightly" \
              --notes-file notes.md --latest
          .github/scripts/retry.sh gh release upload nightly "Readest_${NIGHTLY_VERSION}_x64-portable.exe" --clobber --repo "$GITHUB_REPOSITORY"
          # Manifest fragment for the assemble-manifest job.
          SIG=$(cat "Readest_${NIGHTLY_VERSION}_x64-portable.exe.sig")
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/Readest_${NIGHTLY_VERSION}_x64-portable.exe"
          jq -n --arg url "$ASSET_URL" --arg sig "$SIG" \
            '{platforms: {"windows-x86_64-portable": {url: $url, signature: $sig}}}' > latest-windows.json
          gh release upload nightly latest-windows.json --clobber --repo "$GITHUB_REPOSITORY"
          # Prune: keep only the 7 newest x64 portable builds on the release.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" \
              --jq '[.assets[] | select(.name | endswith("_x64-portable.exe"))] | sort_by(.updated_at) | reverse | .[7:] | .[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "pruned asset $id"
          done

  # ---------------------------- ANDROID (arm64 apk) --------------------------
  android-arm64:
    needs: [sync-dist, compute-version]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist
          persist-credentials: false
      - name: initialize git submodules
        run: git submodule update --init --recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"
      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/readest-app/src-tauri
          key: dist-android-cargo
      # Mirrors upstream nightly.yml's android leg: fresh gen/android, icons
      # regenerated, version patched AFTER the `git checkout .` revert.
      - name: build and sign Android apk
        shell: bash
        timeout-minutes: 90
        env:
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.nightly_version }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/readest-app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          node -e "const f='package.json';const j=require('./'+f);j.version='${NIGHTLY_VERSION}';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
          pushd src-tauri/gen/android
          echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
          echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
          base64 -d <<< "${ANDROID_KEY_BASE64}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          popd
          pnpm tauri android build -t aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Readest_${NIGHTLY_VERSION}_arm64.apk"
      - name: sign apk for the updater
        shell: bash
        working-directory: apps/readest-app
        env:
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.nightly_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri signer sign "Readest_${NIGHTLY_VERSION}_arm64.apk"
      - name: Upload to the rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.nightly_version }}
        run: |
          gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --title "Readest dist - nightly" --latest
          .github/scripts/retry.sh gh release upload nightly "apps/readest-app/Readest_${NIGHTLY_VERSION}_arm64.apk" --clobber --repo "$GITHUB_REPOSITORY"
          # Manifest fragment for the assemble-manifest job.
          SIG=$(cat "apps/readest-app/Readest_${NIGHTLY_VERSION}_arm64.apk.sig")
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/Readest_${NIGHTLY_VERSION}_arm64.apk"
          jq -n --arg url "$ASSET_URL" --arg sig "$SIG" \
            '{platforms: {"android-arm64": {url: $url, signature: $sig}}}' > latest-android.json
          gh release upload nightly latest-android.json --clobber --repo "$GITHUB_REPOSITORY"
          # Prune: keep only the 7 newest arm64 builds on the release.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" \
              --jq '[.assets[] | select(.name | endswith("_arm64.apk"))] | sort_by(.updated_at) | reverse | .[7:] | .[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "pruned asset $id"
          done

  # Merge the per-leg manifest fragments into latest.json + release-notes.json
  # and promote them as release assets, so the in-app updater and changelog box
  # serve this fork's own build instead of upstream's endpoints.
  assemble-manifest:
    needs: [sync-dist, compute-version, windows-x64, android-arm64]
    if: ${{ always() && needs.compute-version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: assemble and promote latest.json + release-notes.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.nightly_version }}
          NOTES: ${{ needs.sync-dist.outputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p frag
          gh release download nightly --repo "$GITHUB_REPOSITORY" -p 'latest-*.json' -D frag --clobber
          [ -n "$(ls -A frag 2>/dev/null)" ] || { echo "::error::no manifest fragments found — both build legs failed"; exit 1; }
          NOTES_TEXT=$(printf '%s' "$NOTES" | sed 's/^- //')
          [ -n "$NOTES_TEXT" ] || NOTES_TEXT="No new upstream commits in this build."
          # Derive both timestamps from the Beijing-time stamp (YYYYMMDDHH) so
          # pub_date and the changelog date always agree with the version stamp.
          STAMP="${NIGHTLY_VERSION##*-}"
          BUILD_DATE="${STAMP:0:4}-${STAMP:4:2}-${STAMP:6:2}"
          PUB_DATE="${BUILD_DATE}T${STAMP:8:2}:00:00+08:00"
          jq -s --arg version "$NIGHTLY_VERSION" --arg pub_date "$PUB_DATE" --arg notes "$NOTES_TEXT" \
            '{version: $version, pub_date: $pub_date, notes: $notes, platforms: (map(.platforms) | add)}' \
            frag/*.json > latest.json
          NOTES_ARRAY=$(printf '%s\n' "$NOTES_TEXT" | jq -R . | jq -s 'map(select(length > 0))')
          jq -n --arg version "$NIGHTLY_VERSION" --arg date "$BUILD_DATE" --argjson notes "$NOTES_ARRAY" \
            '{releases: {($version): {date: $date, notes: $notes}}}' > release-notes.json
          echo "Assembled latest.json platforms:"
          jq -r '.platforms | keys[]' latest.json
          gh release upload nightly latest.json release-notes.json --clobber --repo "$GITHUB_REPOSITORY"
